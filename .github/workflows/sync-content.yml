name: Sync content.js

# The Google Sheet CMS commits data/*.json; this keeps the offline
# fallback (content.js) identical so both render paths show the same site.
on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/build-content.js']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate content.js
        run: node scripts/build-content.js
      - name: Commit if changed
        run: |
          if git diff --quiet content.js; then
            echo "content.js already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js
          git commit -m "Sync content.js from data/*.json"
          git push
